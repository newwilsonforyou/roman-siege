<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Pottery Wheel: Little Master Potter</title>
<style>
  :root{
    --accent:#f28482;
    --panel:#fdf6ef;
    --ink:#4a3f38;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',sans-serif;
    background:#efe3d5;color:var(--ink);
    display:flex;flex-direction:column;min-height:100vh;
  }
  .app{
    display:grid;grid-template-columns:35% 65%;
    flex:1;gap:14px;padding:14px;align-items:stretch;
  }
  @media(max-width:820px){.app{grid-template-columns:1fr;}}

  /* ---------- LEFT PANEL ---------- */
  .left{
    background:var(--panel);border-radius:18px;padding:16px;
    display:flex;flex-direction:column;gap:12px;
    box-shadow:0 6px 18px rgba(74,63,56,.15);
    overflow-y:auto;
  }
  h1{
    font-size:1.4em;color:var(--accent);letter-spacing:.5px;
    text-shadow:1px 1px 0 #fff;line-height:1.15;
  }
  h1 small{display:block;font-size:.55em;color:#a08c80;font-weight:normal;}

  .card{background:#fff;border-radius:14px;padding:10px 12px;border:2px solid #eadbcb;}
  .card h2{font-size:.85em;color:#b06a68;margin-bottom:6px;}

  .targets{display:flex;gap:8px;}
  .tbtn{
    flex:1;background:#fdf1e3;border:3px solid #e4d5c6;border-radius:12px;
    padding:6px 4px;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);
    transition:transform .12s,border-color .12s;
  }
  .tbtn:hover{transform:translateY(-3px);}
  .tbtn.sel{border-color:var(--accent);background:#ffe9e8;box-shadow:0 3px 0 var(--accent);}
  .tbtn svg{width:100%;height:64px;}
  .tbtn span{display:block;font-size:.62em;margin-top:2px;font-weight:bold;}

  .steps{display:flex;gap:6px;}
  .step{
    flex:1;text-align:center;padding:8px 4px;border-radius:10px;
    background:#f3e8da;font-size:.75em;font-weight:bold;color:#a08c80;
    border:2px solid transparent;
  }
  .step.cur{background:#ffe9e8;color:#c06361;border-color:var(--accent);}
  .step.done{background:#e4f2dc;color:#5d9948;}

  .tools{display:flex;flex-direction:column;gap:8px;}
  .toolbtn{
    display:flex;align-items:center;gap:10px;width:100%;
    padding:9px 12px;border:3px solid #e4d5c6;border-radius:12px;
    background:#fff;cursor:pointer;font-family:inherit;font-size:.9em;color:var(--ink);
    transition:transform .12s, border-color .12s, background .12s;text-align:left;
  }
  .toolbtn:hover{transform:translateX(4px);}
  .toolbtn.active{border-color:var(--accent);background:#ffe9e8;box-shadow:0 3px 0 var(--accent);}
  .toolbtn .ico{font-size:1.4em;width:30px;text-align:center;}
  .toolbtn b{display:block;font-size:1em;}
  .toolbtn span.sub{font-size:.7em;color:#9b877a;}

  .colors{display:flex;align-items:center;gap:8px;padding:4px 2px;flex-wrap:wrap;}
  .colors .lbl{font-size:.78em;font-weight:bold;}
  .swatch{
    width:30px;height:30px;border-radius:50%;border:3px solid #fff;cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .12s;
  }
  .swatch:hover{transform:scale(1.12);}
  .swatch.sel{outline:3px solid var(--accent);outline-offset:2px;}

  .guide{
    background:#fff7e8;border-left:6px solid var(--accent);border-radius:10px;
    padding:11px;font-size:.84em;line-height:1.45;min-height:78px;
  }
  .guide b{color:#c06361;}

  .nextbtn{
    background:#7bb661;color:#fff;border:none;border-radius:12px;
    padding:12px 16px;font-family:inherit;font-size:1em;font-weight:bold;cursor:pointer;
    box-shadow:0 4px 0 #5d9948;transition:transform .1s;width:100%;
  }
  .nextbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #5d9948;}
  .nextbtn:disabled{background:#c9c1b6;box-shadow:0 4px 0 #a89f92;cursor:not-allowed;}
  .nextbtn.fire{background:#e07a3f;box-shadow:0 4px 0 #b45a26;}

  /* ---------- RIGHT PANEL ---------- */
  .right{
    position:relative;border-radius:18px;padding:22px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(74,63,56,.2);
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 90px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 3px, transparent 3px 26px),
      linear-gradient(180deg,#a9805a,#946b47 55%,#8a6242);
    overflow:hidden;min-height:520px;
  }
  #bench{
    background:transparent;border-radius:10px;cursor:grab;
    width:100%;max-width:860px;height:auto;display:block;touch-action:none;
  }
  #bench.molding{cursor:crosshair;}

  .benchbar{position:absolute;top:16px;right:16px;z-index:5;display:flex;gap:8px;}
  .wipebtn{
    background:var(--accent);color:#fff;border:none;border-radius:12px;
    padding:10px 14px;font-family:inherit;font-size:.85em;font-weight:bold;cursor:pointer;
    box-shadow:0 4px 0 #c96360;transition:transform .1s;
  }
  .wipebtn:active{transform:translateY(3px);box-shadow:0 1px 0 #c96360;}
  .ghostbtn{
    background:#8a7a6c;color:#fff;border:none;border-radius:12px;
    padding:10px 14px;font-family:inherit;font-size:.85em;font-weight:bold;cursor:pointer;
    box-shadow:0 4px 0 #6b5d51;
  }
  .ghostbtn.off{opacity:.55;}

  .spinhint{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:5;
    background:rgba(255,252,246,.9);border-radius:20px;padding:6px 16px;
    font-size:.78em;color:#8c6f5c;box-shadow:0 3px 8px rgba(0,0,0,.2);
    pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;
  }

  .star{
    position:absolute;pointer-events:none;font-size:20px;z-index:150;
    animation:starfly .9s ease-out forwards;
  }
  @keyframes starfly{
    0%{transform:translate(0,0) scale(.6);opacity:1;}
    100%{transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(200deg);opacity:0;}
  }

  /* ---------- RESULT MODAL ---------- */
  .modal{
    position:fixed;inset:0;background:rgba(50,35,25,.72);z-index:100;
    display:none;align-items:center;justify-content:center;padding:16px;
  }
  .modal.show{display:flex;}
  .modal-card{
    background:var(--panel);border-radius:22px;padding:26px;max-width:420px;width:100%;
    text-align:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1);
    box-shadow:0 14px 40px rgba(0,0,0,.4);
  }
  @keyframes pop{0%{transform:scale(.4);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .badge{font-size:3em;display:inline-block;animation:wob 1.6s ease-in-out infinite;}
  @keyframes wob{0%,100%{transform:rotate(-8deg) scale(1);}50%{transform:rotate(8deg) scale(1.12);}}
  .modal-card h2{color:var(--accent);margin:8px 0 4px;font-size:1.25em;}
  .modal-card p{font-size:.88em;margin-bottom:8px;}
  .starsline{font-size:2em;letter-spacing:6px;margin:6px 0;}
  .accline{font-size:.95em;font-weight:bold;color:#7bb661;margin-bottom:12px;}
  .modal-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .mbtn{
    border:none;border-radius:12px;padding:11px 18px;font-family:inherit;font-weight:bold;
    font-size:.9em;cursor:pointer;color:#fff;transition:transform .1s;
  }
  .mbtn:active{transform:translateY(2px);}
  .mbtn.save{background:#7bb661;box-shadow:0 4px 0 #5d9948;}
  .mbtn.again{background:var(--accent);box-shadow:0 4px 0 #c96360;}
</style>
</head>
<body>
<div class="app">

  <!-- ================= LEFT PANEL ================= -->
  <div class="left">
    <h1>🏺 3D Pottery Wheel
      <small>Throw, open, paint and fire your own historical pot!</small>
    </h1>

    <div class="card">
      <h2>🗺️ Choose a pot to copy</h2>
      <div class="targets">
        <button class="tbtn sel" data-target="maya">
          <svg viewBox="0 0 60 64">
            <path d="M18 8 L42 8 L43 12 L41 14 L41 50 L44 56 L16 56 L19 50 L19 14 L17 12 Z" fill="#b5674d" stroke="#7a4433" stroke-width="1.5"/>
            <rect x="20" y="20" width="20" height="3" fill="#3d2b23"/><rect x="20" y="40" width="20" height="3" fill="#3d2b23"/>
          </svg><span>Maya Vase</span>
        </button>
        <button class="tbtn" data-target="greek">
          <svg viewBox="0 0 60 64">
            <path d="M26 6 L34 6 L34 12 Q33 16 32 18 Q44 22 44 34 Q44 48 34 54 L38 58 L22 58 L26 54 Q16 48 16 34 Q16 22 28 18 Q27 16 26 12 Z" fill="#2e2620" stroke="#1a1512" stroke-width="1.5"/>
            <path d="M22 30 Q30 26 38 30" stroke="#c98a4b" stroke-width="2" fill="none"/>
          </svg><span>Greek Amphora</span>
        </button>
        <button class="tbtn" data-target="inca">
          <svg viewBox="0 0 60 64">
            <path d="M27 6 L33 6 L34 14 Q34 16 33 18 Q46 22 46 36 Q46 50 30 56 Q14 50 14 36 Q14 22 27 18 Q26 16 26 14 Z" fill="#c98a4b" stroke="#8a5a2b" stroke-width="1.5"/>
            <path d="M20 34 L40 34 M22 40 L38 40" stroke="#6b3f1d" stroke-width="2"/>
          </svg><span>Inca Aryballus</span>
        </button>
      </div>
    </div>

    <div class="steps">
      <div class="step cur" id="step-shape">1️⃣ SHAPE</div>
      <div class="step" id="step-paint">2️⃣ PAINT</div>
      <div class="step" id="step-fire">3️⃣ FIRE</div>
    </div>

    <div class="tools" id="paintTools" style="display:none">
      <button class="toolbtn active" data-brush="glaze">
        <span class="ico">🪣</span><span><b>Glaze All</b><span class="sub">Paint the whole pot this color</span></span>
      </button>
      <button class="toolbtn" data-brush="band">
        <span class="ico">➖</span><span><b>Ring Band</b><span class="sub">Tap the pot to paint a stripe</span></span>
      </button>
      <button class="toolbtn" data-brush="dots">
        <span class="ico">🔵</span><span><b>Dot Pattern</b><span class="sub">Tap to stamp spinning dots</span></span>
      </button>
      <button class="toolbtn" data-brush="zigzag">
        <span class="ico">〰️</span><span><b>Zigzag</b><span class="sub">Tap to add a wavy pattern</span></span>
      </button>
    </div>

    <div class="colors" id="paintColors" style="display:none">
      <span class="lbl">🎨 Paint:</span>
      <div class="swatch sel" data-color="#b5674d" style="background:#b5674d" title="Terracotta"></div>
      <div class="swatch" data-color="#2e2620" style="background:#2e2620" title="Charcoal Black"></div>
      <div class="swatch" data-color="#e8d5ae" style="background:#e8d5ae" title="Cream"></div>
      <div class="swatch" data-color="#6b705c" style="background:#6b705c" title="Forest Moss"></div>
      <div class="swatch" data-color="#c98a4b" style="background:#c98a4b" title="Ochre"></div>
    </div>

    <div class="guide" id="guide"></div>

    <button class="nextbtn" id="nextbtn">✋ Done shaping → Paint!</button>
  </div>

  <!-- ================= RIGHT PANEL ================= -->
  <div class="right">
    <div class="benchbar">
      <button class="ghostbtn" id="ghost">👻 Guide Outline</button>
      <button class="wipebtn" id="wipe">🧽 Re-center Clay</button>
    </div>
    <canvas id="bench" width="900" height="640"></canvas>
    <div class="spinhint" id="hint">🖐️ Drag the clay sides • Press the middle to open it • Drag the table to tilt!</div>
  </div>
</div>

<!-- ================= RESULT MODAL ================= -->
<div class="modal" id="modal">
  <div class="modal-card">
    <span class="badge">🏺</span>
    <h2 id="mtitle">Your pot is fired!</h2>
    <p id="mdesc"></p>
    <div class="starsline" id="stars"></div>
    <div class="accline" id="accline"></div>
    <div class="modal-actions">
      <button class="mbtn save" id="download">💾 Save My Pot</button>
      <button class="mbtn again" id="restart">🔄 Throw a New Pot</button>
    </div>
  </div>
</div>

<script>
function $(id){return document.getElementById(id);}
var canvas=$('bench'), ctx=canvas.getContext('2d');
var CW=canvas.width, CH=canvas.height;
var CX=CW/2, CY=CH*0.52;
var FOV=1150;

/* ================= 3D CAMERA (orbit: drag the table) ================= */
var yaw=0.0, pitch=0.55;                 /* pitch up = look down into the pot */
function rot(p){
  var cy=Math.cos(yaw), sy=Math.sin(yaw);
  var x=p.x*cy - p.z*sy, z=p.x*sy + p.z*cy, y=p.y;
  var cp=Math.cos(pitch), sp=Math.sin(pitch);
  var y2=y*cp + z*sp, z2=-y*sp + z*cp;
  return {x:x,y:y2,z:z2};
}
function proj(p){
  var k=FOV/(FOV+p.z);
  return {x:CX+p.x*k, y:CY-p.y*k, k:k};
}
var LIGHT=(function(){var l={x:-0.4,y:0.8,z:-0.45};var m=Math.hypot(l.x,l.y,l.z);return {x:l.x/m,y:l.y/m,z:l.z/m};})();

/* ================= POT PROFILE ================= */
var N=36, M=22;                          /* height levels x angular segments */
var H=400;                               /* model height */
var PIVOT=H*0.44;
var RMIN=12, RMAX=185, WALL=16;
function yOf(i){return i*H/(N-1)-PIVOT;}

var prof=[];
function freshClay(){
  prof=[];
  for(var i=0;i<N;i++){var t=i/(N-1);prof.push(112-68*t);}
}
var holeDepth=0, MAXHOLE=N-6;            /* pressed-open depth in levels */
function holeBottom(){return Math.max(3,N-1-Math.floor(holeDepth));}
function innerR(i){return Math.max(3,prof[i]-WALL);}

/* target pots */
var TARGETS={
  maya:{name:'Maya Cylinder Vase',place:'Guatemala, 600–900 AD',
    keys:[[0,95],[0.08,88],[0.5,82],[0.9,84],[1,92]],
    story:'Maya artists painted kings and gods on tall cylinder vases just like this!'},
  greek:{name:'Greek Amphora',place:'Athens, 500 BC',
    keys:[[0,55],[0.12,70],[0.45,120],[0.7,80],[0.85,40],[0.93,42],[1,58]],
    story:'Amphorae carried olive oil and wine all around the ancient sea!'},
  inca:{name:'Inca Aryballus',place:'Peru, 1400 AD',
    keys:[[0,40],[0.2,95],[0.45,130],[0.7,75],[0.85,32],[0.95,36],[1,52]],
    story:'The aryballus was carried on the back with a rope through its handles!'}
};
var targetKey='maya', target=[];
function buildTarget(){
  var keys=TARGETS[targetKey].keys;
  target=[];
  for(var i=0;i<N;i++){
    var t=i/(N-1), a=keys[0], b=keys[keys.length-1];
    for(var k=0;k<keys.length-1;k++){
      if(t>=keys[k][0]&&t<=keys[k+1][0]){a=keys[k];b=keys[k+1];break;}
    }
    var f=(b[0]===a[0])?0:(t-a[0])/(b[0]-a[0]);
    f=(1-Math.cos(f*Math.PI))/2;
    target.push(a[1]+(b[1]-a[1])*f);
  }
}

/* ================= GAME STATE ================= */
var stage='shape';
var spin=0, spinSpeed=0.055;
var baseColor='#9a8578', glazed=false, fired=false;
var decors=[], brush='glaze', paintColor='#b5674d';
var shapeWork=0, showGhost=true;
var firing=false, fireAnim=0;

var GUIDES={
  shape:'<b>Shape it!</b> The wheel is spinning. <b>Drag the sides</b> of the clay to pull out or push in. <b>Press and hold the middle</b> to open a hole, like a real potter! Drag the wooden table to tilt and peek inside from the top. Match the 👻 dashed outline!',
  paint:'<b>Paint it!</b> Real potters decorated every pot with meaning. Pick a brush and a color, then <b>tap the pot</b> where you want the pattern. Tilt the view to paint near the rim!',
  fire:'<b>Fire it!</b> Pots must bake in a super-hot kiln (about 1000°C!) to become hard and shiny. Press the big FIRE button when you are ready!',
  done:'<b>Beautiful!</b> Your pot is fired and finished. Tilt it around, look inside, save a picture, or throw a new pot!'
};

/* ================= HELPERS ================= */
function shadeHex(hex,mul,add){
  var n=parseInt(hex.slice(1),16);
  var r=Math.min(255,Math.max(0,Math.round(((n>>16)&255)*mul+add))),
      g=Math.min(255,Math.max(0,Math.round(((n>>8)&255)*mul+add))),
      b=Math.min(255,Math.max(0,Math.round((n&255)*mul+add)));
  return 'rgb('+r+','+g+','+b+')';
}
function potColor(){return fired?shadeHex(baseColor,0.94,-6):baseColor;}
function decorColor(c){return fired?shadeHex(c,0.9,-6):c;}
function axisScreen(i){return proj(rot({x:0,y:yOf(i),z:0}));}

/* ================= SCENE BUILD ================= */
function surfPoint(i,ang,rOff){
  var r=prof[i]+(rOff||0);
  return {x:r*Math.cos(ang), y:yOf(i), z:r*Math.sin(ang)};
}
function quadItem(p0,p1,p2,p3,normal,color,extraMul){
  var r0=rot(p0),r1=rot(p1),r2=rot(p2),r3=rot(p3);
  var rn=rot(normal);
  if(rn.z>0.03)return null;                        /* backface */
  var lum=Math.max(0,rn.x*LIGHT.x+rn.y*LIGHT.y+rn.z*LIGHT.z);
  var mul=(0.55+0.6*lum)*(extraMul||1)*(fired?1.08:1);
  var s0=proj(r0),s1=proj(r1),s2=proj(r2),s3=proj(r3);
  return {depth:(r0.z+r1.z+r2.z+r3.z)/4,
    draw:(function(fill){return function(){
      ctx.fillStyle=fill;ctx.strokeStyle=fill;ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(s0.x,s0.y);ctx.lineTo(s1.x,s1.y);ctx.lineTo(s2.x,s2.y);ctx.lineTo(s3.x,s3.y);
      ctx.closePath();ctx.fill();ctx.stroke();
    };})(shadeHex(color,mul,0))};
}
function buildPot(items){
  var col=potColor();
  var dh=H/(N-1), hb=holeBottom();
  for(var j=0;j<M;j++){
    var a0=j*2*Math.PI/M, a1=(j+1)*2*Math.PI/M, am=(a0+a1)/2;
    var ca=Math.cos(am), sa=Math.sin(am);
    /* outer wall */
    for(var i=0;i<N-1;i++){
      var slope=(prof[i+1]-prof[i])/dh;
      var nl=Math.hypot(1,slope);
      var nrm={x:ca/nl, y:-slope/nl, z:sa/nl};
      var q=quadItem(surfPoint(i,a0,0),surfPoint(i,a1,0),surfPoint(i+1,a1,0),surfPoint(i+1,a0,0),nrm,col,1);
      if(q)items.push(q);
    }
    if(holeDepth>=1){
      /* inner wall (visible when you look inside from the top) */
      for(var i2=hb;i2<N-1;i2++){
        var slope2=(innerR(i2+1)-innerR(i2))/dh;
        var nl2=Math.hypot(1,slope2);
        var nrm2={x:-ca/nl2, y:slope2/nl2, z:-sa/nl2};
        var pA={x:innerR(i2)*Math.cos(a0),y:yOf(i2),z:innerR(i2)*Math.sin(a0)},
            pB={x:innerR(i2)*Math.cos(a1),y:yOf(i2),z:innerR(i2)*Math.sin(a1)},
            pC={x:innerR(i2+1)*Math.cos(a1),y:yOf(i2+1),z:innerR(i2+1)*Math.sin(a1)},
            pD={x:innerR(i2+1)*Math.cos(a0),y:yOf(i2+1),z:innerR(i2+1)*Math.sin(a0)};
        var q2=quadItem(pA,pB,pC,pD,nrm2,col,0.45);
        if(q2)items.push(q2);
      }
      /* clay floor inside the hole */
      var rf=innerR(hb);
      var f0={x:0,y:yOf(hb),z:0};
      var qf=quadItem(f0,
        {x:rf*Math.cos(a0),y:yOf(hb),z:rf*Math.sin(a0)},
        {x:rf*Math.cos(am),y:yOf(hb),z:rf*Math.sin(am)},
        {x:rf*Math.cos(a1),y:yOf(hb),z:rf*Math.sin(a1)},
        {x:0,y:1,z:0},col,0.5);
      if(qf)items.push(qf);
      /* rim ring between outer and inner top edge */
      var rt=prof[N-1], ri=innerR(N-1), yt=yOf(N-1);
      var qr=quadItem(
        {x:rt*Math.cos(a0),y:yt,z:rt*Math.sin(a0)},
        {x:rt*Math.cos(a1),y:yt,z:rt*Math.sin(a1)},
        {x:ri*Math.cos(a1),y:yt,z:ri*Math.sin(a1)},
        {x:ri*Math.cos(a0),y:yt,z:ri*Math.sin(a0)},
        {x:0,y:1,z:0},col,1.05);
      if(qr)items.push(qr);
    }else{
      /* solid clay: flat top cap */
      var rt2=prof[N-1], yt2=yOf(N-1);
      var qc=quadItem({x:0,y:yt2,z:0},
        {x:rt2*Math.cos(a0),y:yt2,z:rt2*Math.sin(a0)},
        {x:rt2*Math.cos(am),y:yt2,z:rt2*Math.sin(am)},
        {x:rt2*Math.cos(a1),y:yt2,z:rt2*Math.sin(a1)},
        {x:0,y:1,z:0},col,1.02);
      if(qc)items.push(qc);
    }
  }
}

/* ================= DECOR + SPIN SPECKLES (depth-sorted with the pot) ================= */
var FLECKS=[];
(function(){for(var i=0;i<70;i++)FLECKS.push({phi:Math.random()*Math.PI*2,lev:2+Math.floor(Math.random()*(N-4)),s:1.2+Math.random()*2,dark:Math.random()<0.6});})();

function frontOf(ang){ /* is this angle on the camera-facing side? */
  return rot({x:Math.cos(ang),y:0,z:Math.sin(ang)}).z<=0;
}
function surfItem(lev,ang,drawFn){
  var p=surfPoint(lev,ang,2.5);
  var rp=rot(p), sp=proj(rp);
  return {depth:rp.z-4, draw:function(){drawFn(sp);}};
}
function buildDecor(items){
  var col=potColor();
  FLECKS.forEach(function(f){
    var a=f.phi+spin;
    if(!frontOf(a))return;
    items.push(surfItem(f.lev,a,function(sp){
      ctx.globalAlpha=0.3;
      ctx.fillStyle=f.dark?shadeHex(col,0.55,-15):shadeHex(col,1.5,45);
      ctx.beginPath();ctx.arc(sp.x,sp.y,f.s*sp.k,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
    }));
  });
  decors.forEach(function(d){
    var c=decorColor(d.color);
    if(d.type==='band'){
      for(var j=0;j<M;j++){
        var a0=spin+j*2*Math.PI/M, a1=spin+(j+1)*2*Math.PI/M;
        if(!frontOf((a0+a1)/2))continue;
        var s0=proj(rot(surfPoint(d.lev,a0,2.5))), s1=proj(rot(surfPoint(d.lev,a1,2.5)));
        var dep=rot(surfPoint(d.lev,(a0+a1)/2,2.5)).z-4;
        items.push({depth:dep,draw:(function(p0,p1){return function(){
          ctx.strokeStyle=c;ctx.lineWidth=9*p0.k;ctx.lineCap='round';
          ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.stroke();
        };})(s0,s1)});
      }
    }else if(d.type==='dots'){
      for(var k=0;k<10;k++){
        var a=spin+d.phase+k*Math.PI/5;
        if(!frontOf(a))continue;
        items.push(surfItem(d.lev,a,function(sp){
          ctx.fillStyle=c;
          ctx.beginPath();ctx.arc(sp.x,sp.y,7*sp.k,0,Math.PI*2);ctx.fill();
        }));
      }
    }else{ /* zigzag */
      var pts=[];
      for(var k2=0;k2<=14;k2++){
        var a2=spin+d.phase+k2*2*Math.PI/14;
        var lv=Math.min(N-2,Math.max(1,d.lev+((k2%2)?2:-2)));
        pts.push({a:a2,lv:lv});
      }
      for(var q=0;q<pts.length-1;q++){
        var amid=(pts[q].a+pts[q+1].a)/2;
        if(!frontOf(amid))continue;
        var s2=proj(rot(surfPoint(pts[q].lv,pts[q].a,2.5))),
            s3=proj(rot(surfPoint(pts[q+1].lv,pts[q+1].a,2.5)));
        var dep2=rot(surfPoint(d.lev,amid,2.5)).z-4;
        items.push({depth:dep2,draw:(function(p0,p1){return function(){
          ctx.strokeStyle=c;ctx.lineWidth=4*p0.k;ctx.lineCap='round';
          ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.stroke();
        };})(s2,s3)});
      }
    }
  });
}

/* ================= WHEEL / GHOST / FIRE ================= */
function groundPoint(r,ang,dy){return rot({x:r*Math.cos(ang),y:-PIVOT-8+(dy||0),z:r*Math.sin(ang)});}
function drawWheel(){
  /* disc */
  ctx.beginPath();
  for(var k=0;k<=36;k++){
    var p=proj(groundPoint(255,k*Math.PI/18));
    if(k===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
  }
  ctx.closePath();
  var g=ctx.createLinearGradient(CX-240,0,CX+240,0);
  g.addColorStop(0,'#5a4a3e');g.addColorStop(0.5,'#7d685a');g.addColorStop(1,'#4e3f34');
  ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=3;ctx.stroke();
  /* spinning spokes */
  var c=proj(groundPoint(0,0));
  for(var s=0;s<6;s++){
    var a=spin+s*Math.PI/3;
    var e=proj(groundPoint(248,a));
    ctx.strokeStyle='rgba(40,28,20,0.16)';
    ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(e.x,e.y);ctx.stroke();
  }
  /* bright chips on the rim */
  for(var s2=0;s2<8;s2++){
    var a2=spin+s2*Math.PI/4;
    var p2=proj(groundPoint(228,a2));
    ctx.fillStyle='rgba(255,235,200,0.5)';
    ctx.beginPath();ctx.arc(p2.x,p2.y,5,0,Math.PI*2);ctx.fill();
  }
  /* soft shadow under the pot */
  var mx=Math.max.apply(null,prof);
  ctx.fillStyle='rgba(30,18,8,0.3)';
  ctx.beginPath();
  for(var k2=0;k2<=24;k2++){
    var p3=proj(groundPoint(mx*1.05,k2*Math.PI/12,2));
    if(k2===0)ctx.moveTo(p3.x,p3.y);else ctx.lineTo(p3.x,p3.y);
  }
  ctx.closePath();ctx.fill();
}
function drawGhost(){
  if(!showGhost||stage!=='shape')return;
  ctx.save();
  ctx.setLineDash([10,8]);
  ctx.strokeStyle='rgba(255,255,255,0.8)';
  ctx.lineWidth=3;
  ctx.beginPath();
  for(var i=0;i<N;i++){
    var c=axisScreen(i);
    var x=c.x-target[i]*c.k;
    if(i===0)ctx.moveTo(x,c.y);else ctx.lineTo(x,c.y);
  }
  for(var j=0;j<N;j++){
    var c2=axisScreen(j);
    var x2=c2.x+target[j]*c2.k;
    if(j===0)ctx.moveTo(x2,c2.y);else ctx.lineTo(x2,c2.y);
  }
  ctx.stroke();
  ctx.restore();
}
function drawFire(){
  if(!firing&&fireAnim<=0)return;
  var a=fireAnim;
  var g=ctx.createLinearGradient(0,CH,0,CH*0.2);
  g.addColorStop(0,'rgba(255,120,20,'+(0.55*a)+')');
  g.addColorStop(0.5,'rgba(255,60,10,'+(0.28*a)+')');
  g.addColorStop(1,'rgba(60,10,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
  for(var i=0;i<26;i++){
    var seed=(i*137.5+performance.now()*0.12)%CH;
    var x=(i*97)%CW, y=CH-seed;
    ctx.globalAlpha=a*(0.3+0.5*Math.abs(Math.sin(i+performance.now()*0.005)));
    ctx.fillStyle=i%3?'#ffb347':'#ff6b35';
    ctx.beginPath();ctx.arc(x,y,2+(i%4),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function render(){
  ctx.clearRect(0,0,CW,CH);
  drawWheel();
  var items=[];
  buildPot(items);
  buildDecor(items);
  items.sort(function(a,b){return b.depth-a.depth;});
  for(var i=0;i<items.length;i++)items[i].draw();
  drawGhost();
  drawFire();
}

/* ================= INTERACTION ================= */
var dragging=false, mode='orbit', px0=0, py0=0;
function evPos(e){
  var r=canvas.getBoundingClientRect();
  var cx,cy;
  if(e.touches&&e.touches.length){cx=e.touches[0].clientX;cy=e.touches[0].clientY;}
  else if(e.changedTouches&&e.changedTouches.length){cx=e.changedTouches[0].clientX;cy=e.changedTouches[0].clientY;}
  else{cx=e.clientX;cy=e.clientY;}
  return {x:(cx-r.left)*(canvas.width/r.width), y:(cy-r.top)*(canvas.height/r.height)};
}
function nearestLevel(x,y){
  var best=0,bd=1e9;
  for(var i=0;i<N;i++){
    var c=axisScreen(i);
    var d=Math.abs(y-c.y);
    if(d<bd){bd=d;best=i;}
  }
  return best;
}
function onPot(x,y){
  var lev=nearestLevel(x,y);
  var c=axisScreen(lev);
  /* vertical bounds check */
  var top=axisScreen(N-1), bot=axisScreen(0);
  var yMin=Math.min(top.y,bot.y)-prof[N-1]*0.35, yMax=Math.max(top.y,bot.y)+22;
  if(y<yMin||y>yMax)return null;
  if(Math.abs(x-c.x)>prof[lev]*c.k+34)return null;
  return lev;
}
function inOpening(x,y){
  /* inside the projected rim ellipse = pressing the middle of the clay */
  var c=axisScreen(N-1);
  var rx=prof[N-1]*c.k;
  var side=proj(rot({x:0,y:yOf(N-1),z:prof[N-1]}));
  var ry=Math.max(8,Math.abs(side.y-c.y));
  var dx=(x-c.x)/(rx*0.85), dy2=(y-c.y)/(ry+14);
  return dx*dx+dy2*dy2<1;
}
function mold(x,y){
  var lev=nearestLevel(x,y);
  var c=axisScreen(lev);
  var desired=Math.min(RMAX,Math.max(RMIN,Math.abs(x-c.x)/c.k));
  for(var j=0;j<N;j++){
    var w=Math.exp(-Math.pow(j-lev,2)/14);
    prof[j]+=(desired-prof[j])*0.3*w;
  }
  for(var s=1;s<N-1;s++)prof[s]=prof[s]*0.72+(prof[s-1]+prof[s+1])*0.14;
  shapeWork++;
  if(shapeWork%9===0)squish();
}
function paintAt(x,y){
  var lev=onPot(x,y);
  if(lev===null)return false;
  if(brush==='glaze'){baseColor=paintColor;glazed=true;pour();return true;}
  if(decors.length>=14){thunk();return true;}
  decors.push({type:brush,lev:Math.min(N-4,Math.max(3,lev)),color:paintColor,phase:Math.random()*Math.PI*2});
  stamp();
  return true;
}
function down(e){
  e.preventDefault();dragging=true;
  var p=evPos(e);px0=p.x;py0=p.y;
  if(stage==='shape'&&inOpening(p.x,p.y)){mode='hole';}
  else if(stage==='shape'&&onPot(p.x,p.y)!==null){mode='mold';mold(p.x,p.y);}
  else if(stage==='paint'&&paintAt(p.x,p.y)){mode='painted';}
  else{mode='orbit';}
  canvas.classList.toggle('molding',mode==='mold'||mode==='hole');
}
function move(e){
  if(!dragging)return;
  e.preventDefault();
  var p=evPos(e);
  if(mode==='mold'&&stage==='shape')mold(p.x,p.y);
  else if(mode==='orbit'){
    yaw+=(p.x-px0)*0.008;
    pitch=Math.min(1.35,Math.max(0.06,pitch+(p.y-py0)*0.006));
  }
  px0=p.x;py0=p.y;
}
function up(){dragging=false;mode='orbit';canvas.classList.remove('molding');}
canvas.addEventListener('mousedown',down);
window.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
canvas.addEventListener('touchstart',down,{passive:false});
canvas.addEventListener('touchmove',move,{passive:false});
canvas.addEventListener('touchend',up);
canvas.addEventListener('touchcancel',up);

/* ================= LOOP ================= */
function loop(){
  spin+=spinSpeed*(firing?2.2:1);
  if(dragging&&mode==='hole'&&stage==='shape'){
    var was=Math.floor(holeDepth);
    holeDepth=Math.min(MAXHOLE,holeDepth+0.45);
    shapeWork++;
    if(Math.floor(holeDepth)!==was)squish();
  }
  if(firing){
    fireAnim=Math.min(1,fireAnim+0.012);
    if(fireAnim>=1)finishFiring();
  }else if(fireAnim>0)fireAnim=Math.max(0,fireAnim-0.02);
  render();
  requestAnimationFrame(loop);
}

/* ================= ACCURACY / STAGES ================= */
function accuracy(){
  var sum=0;
  for(var i=0;i<N;i++)sum+=Math.abs(prof[i]-target[i]);
  var diff=sum/N/RMAX;
  var acc=Math.max(5,Math.min(100,Math.round(100-diff*260)));
  if(holeDepth>=3)acc=Math.min(100,acc+4);   /* opened like a real pot! */
  return acc;
}
function setStage(s){
  stage=s;
  ['shape','paint','fire'].forEach(function(k){$('step-'+k).classList.remove('cur','done');});
  if(s==='shape'){$('step-shape').classList.add('cur');}
  if(s==='paint'){$('step-shape').classList.add('done');$('step-paint').classList.add('cur');}
  if(s==='fire'){$('step-shape').classList.add('done');$('step-paint').classList.add('done');$('step-fire').classList.add('cur');}
  if(s==='done'){['shape','paint','fire'].forEach(function(k){$('step-'+k).classList.add('done');});}
  $('paintTools').style.display=(s==='paint')?'flex':'none';
  $('paintColors').style.display=(s==='paint')?'flex':'none';
  $('guide').innerHTML=GUIDES[s]||'';
  var nb=$('nextbtn');
  nb.classList.remove('fire');
  if(s==='shape'){nb.textContent='✋ Done shaping → Paint!';nb.disabled=false;$('hint').textContent='🖐️ Drag the clay sides • Press the middle to open it • Drag the table to tilt!';}
  if(s==='paint'){nb.textContent='🎨 Done painting → Kiln!';nb.disabled=false;$('hint').textContent='🎨 Pick a brush + color, then tap the pot! Drag the table to tilt.';}
  if(s==='fire'){nb.textContent='🔥 FIRE THE KILN!';nb.classList.add('fire');nb.disabled=false;$('hint').textContent='🔥 Ready? Press the big orange button!';}
  if(s==='done'){nb.textContent='🔄 Throw a New Pot';nb.disabled=false;$('hint').textContent='⭐ Tilt it, look inside, admire your masterpiece!';}
}
$('nextbtn').addEventListener('click',function(){
  if(stage==='shape'){
    if(shapeWork<25){wob();$('guide').innerHTML='<b>Keep going!</b> Mold the clay a little more — drag the sides, and press the middle to open it up!';return;}
    chime();setStage('paint');
  }else if(stage==='paint'){chime();setStage('fire');}
  else if(stage==='fire'){startFiring();}
  else{resetGame();}
});
function startFiring(){
  firing=true;fireAnim=0;
  $('nextbtn').disabled=true;
  $('hint').textContent='🔥 1000°C… the kiln is glowing…';
  roar();
}
function finishFiring(){
  firing=false;fired=true;fireAnim=0.99;
  spinSpeed=0.02;
  setStage('done');
  var acc=accuracy();
  var t=TARGETS[targetKey];
  var stars=acc>=82?3:(acc>=60?2:1);
  $('mtitle').textContent='Congratulations, Master Potter!';
  $('mdesc').innerHTML='You recreated the <b>'+t.name+'</b> ('+t.place+').<br>'+t.story;
  $('stars').textContent=['','⭐','⭐⭐','⭐⭐⭐'][stars];
  $('accline').textContent='Shape match: '+acc+'%'+(holeDepth>=3?' (+ opened like a real potter! 🕳️)':'');
  $('modal').classList.add('show');
  fanfare();
  starBurst($('modal'));
}

/* ================= AUDIO ================= */
var actx=null;
function audio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return actx;}
function tone(freq,type,t0,dur,vol){
  var a=audio();if(!a)return;
  var o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,a.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(vol,a.currentTime+t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t0+dur);
  o.connect(g).connect(a.destination);
  o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+0.05);
}
function squish(){tone(180+Math.random()*80,'sine',0,0.08,0.06);}
function pour(){tone(392,'sine',0,0.2,0.15);tone(523,'sine',0.1,0.25,0.15);}
function stamp(){tone(660,'triangle',0,0.1,0.15);}
function thunk(){tone(150,'sine',0,0.2,0.2);}
function wob(){tone(196,'sine',0,0.25,0.18);}
function chime(){[523.25,659.25,783.99].forEach(function(f,i){tone(f,'sine',i*0.09,0.5,0.22);});}
function fanfare(){[392,523.25,659.25,783.99,1046.5].forEach(function(f,i){tone(f,'triangle',i*0.12,0.7,0.25);});}
function roar(){
  var a=audio();if(!a)return;
  var dur=5;
  var buf=a.createBuffer(1,a.sampleRate*dur,a.sampleRate);
  var d=buf.getChannelData(0);
  for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,0.6)*0.25;
  var src=a.createBufferSource();src.buffer=buf;
  var f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=420;
  src.connect(f).connect(a.destination);src.start();
}

/* ================= FX / UI ================= */
function starBurst(el){
  var r=el.getBoundingClientRect();
  for(var i=0;i<10;i++){
    var s=document.createElement('div');
    s.className='star';s.textContent=['⭐','✨','🌟'][i%3];
    s.style.left=(r.left+r.width/2)+'px';
    s.style.top=(r.top+r.height/2)+'px';
    s.style.setProperty('--dx',(Math.cos(i/10*Math.PI*2)*(70+Math.random()*60))+'px');
    s.style.setProperty('--dy',(Math.sin(i/10*Math.PI*2)*(70+Math.random()*60))+'px');
    document.body.appendChild(s);
    setTimeout(function(n){return function(){n.remove();};}(s),950);
  }
}
document.querySelectorAll('.tbtn').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.tbtn').forEach(function(x){x.classList.remove('sel');});
    b.classList.add('sel');
    targetKey=b.dataset.target;
    buildTarget();
    var t=TARGETS[targetKey];
    if(stage==='shape')$('guide').innerHTML='<b>'+t.name+'</b> ('+t.place+') — '+t.story+' Match the dashed outline!';
  });
});
document.querySelectorAll('#paintTools .toolbtn').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('#paintTools .toolbtn').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');
    brush=b.dataset.brush;
  });
});
document.querySelectorAll('.swatch').forEach(function(s){
  s.addEventListener('click',function(){
    document.querySelectorAll('.swatch').forEach(function(x){x.classList.remove('sel');});
    s.classList.add('sel');
    paintColor=s.dataset.color;
  });
});
$('ghost').addEventListener('click',function(){
  showGhost=!showGhost;
  $('ghost').classList.toggle('off',!showGhost);
});
$('wipe').addEventListener('click',function(){
  freshClay();shapeWork=0;holeDepth=0;
  if(stage!=='shape'){decors=[];baseColor='#9a8578';glazed=false;fired=false;spinSpeed=0.055;setStage('shape');}
  thunk();
});
$('download').addEventListener('click',function(){
  var out=document.createElement('canvas');
  out.width=CW;out.height=CH;
  var o=out.getContext('2d');
  var g=o.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,'#a9805a');g.addColorStop(1,'#8a6242');
  o.fillStyle=g;o.fillRect(0,0,CW,CH);
  o.drawImage(canvas,0,0);
  var a=document.createElement('a');
  a.download='my-historical-pot.png';
  a.href=out.toDataURL('image/png');
  a.click();
});
function resetGame(){
  freshClay();decors=[];shapeWork=0;holeDepth=0;
  baseColor='#9a8578';glazed=false;fired=false;firing=false;fireAnim=0;
  spinSpeed=0.055;yaw=0;pitch=0.55;
  $('modal').classList.remove('show');
  setStage('shape');
}
$('restart').addEventListener('click',resetGame);

/* ================= INIT ================= */
freshClay();
buildTarget();
setStage('shape');
loop();
</script>
